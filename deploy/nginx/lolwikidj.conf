map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream lolwikidj2_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name lolwikidj.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name lolwikidj.example.com;

    ssl_certificate /etc/letsencrypt/live/lolwikidj.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lolwikidj.example.com/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://lolwikidj2_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
