services:
  app:
    build:
      context: .
    image: lolwikidj2:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - lolwikidj_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  lolwikidj_data:
